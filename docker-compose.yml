# Nube privada del taller: almacenamiento S3 (Silo, bifurcación comunitaria de MinIO)
# + API de AWS emuladas (Moto). Todos los puertos se publican SOLO en 127.0.0.1.
#
# Nota de cadena de suministro: MinIO retiró sus imágenes de Docker Hub en septiembre de 2026
# ("pull access denied for minio/minio"). Silo mantiene compatibilidad total con MinIO
# (mismas variables MINIO_*, mismos puertos y el mismo cliente mc/mcli).
# Las imágenes se fijan por versión para que el laboratorio sea reproducible.

name: nube-taller

services:
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    container_name: nube-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Falta MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Falta MINIO_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:9000:9000"   # API S3
      - "127.0.0.1:9001:9001"   # Consola web
    volumes:
      - minio-datos:/data
    networks: [nube]
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  moto:
    # Emulador de API de AWS (IAM, STS, Secrets Manager...). Licencia Apache 2.0, sin registro.
    image: motoserver/moto:5.2.3
    container_name: nube-moto
    environment:
      MOTO_PORT: "5000"
    ports:
      - "127.0.0.1:5000:5000"
    networks: [nube]
    restart: unless-stopped

networks:
  nube:
    driver: bridge

volumes:
  minio-datos:
